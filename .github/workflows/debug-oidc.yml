name: Debug OIDC Claims Native
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Decode OIDC Token
        run: |
          # 1. Fetch the OIDC token from GitHub's internal provider
          TOKEN=$(curl -sLS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          
          # 2. Extract the payload (the middle section of the JWT)
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)
          
          # 3. Decode the base64 payload and format it as JSON
          echo "=== YOUR EXACT GITHUB OIDC CLAIMS ==="
          echo "${PAYLOAD}===" | base64 --decode 2>/dev/null | jq .
