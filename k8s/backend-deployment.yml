apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-backend
  namespace: journey-ns
  labels:
    app: journey-backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: journey-backend
  template:
    metadata:
      labels:
        app: journey-backend
    spec:
      containers:
      - name: backend-api
        image:  277328279179.dkr.ecr.us-east-1.amazonaws.com/journey-backend
        ports:
        - containerPort: 5000 
        
        
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: rds-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rds-secret
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: rds-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: rds-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: rds-secret
              key: DB_NAME
        
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10